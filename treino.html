<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stronger | Treino de Hoje</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body onload="iniciarTreino()">

    <header>
        <a class="logo" href="stronger.html">STRONGER</a>
        <nav>
            <a href="stronger.html">Home</a>
            <span id="menu_sistema">
                <a href="treino.html" class="ativo">Treino de Hoje</a>
                <a href="progresso.html">Progresso</a>
                <a href="calculos.html">Cálculos</a>
                <a href="ajustes.html">Ajustar peso</a>
                <a href="termos.html" id="menu_termos" style="display: none;">Termos</a>
            </span>
        </nav>
        <div class="conta">
            <span id="menu_visitante">
                <a href="cadastro.html" class="botao">Cadastrar</a>
                <a href="login.html" class="botao">Login</a>
            </span>
            <span id="menu_usuario">
                <span id="exibir_nome"></span>
                <button onclick="sair()">Sair</button>
            </span>
        </div>
    </header>

    <main class="conteudo">
        <div class="caixa grande">
            <h2>Treino de Hoje</h2>
            <label>Dia da semana:</label>
            <select id="ipt_dia" onchange="mostrarTreino()">
                <option value="0">Domingo</option>
                <option value="1">Segunda</option>
                <option value="2">Terça</option>
                <option value="3">Quarta</option>
                <option value="4">Quinta</option>
                <option value="5">Sexta</option>
                <option value="6">Sábado</option>
            </select>
            <label>Semana do ciclo:</label>
            <select id="ipt_semana" onchange="mostrarTreino()">
                <option value="1">Semana 1 (3x5)</option>
                <option value="2">Semana 2 (3x3)</option>
                <option value="3">Semana 3 (3x5/3/1)</option>
                <option value="4">Semana 4 (5x5)</option>
            </select>
            <label>Treino de assistência:</label>
            <select id="ipt_assist" onchange="mostrarTreino()">
                <option>Big and dumb</option>
                <option>Big Muscle</option>
            </select>
            <div id="exibir_treino"></div>

            <!-- finalizar treino -->
            <div id="tela_finalizar" class="finalizar">
                <label id="rotulo_amrap">Repetições feitas no AMRAP*:</label>
                <input id="ipt_reps_amrap" type="number" placeholder="Repetições">
                <button onclick="finalizarTreino()">Finalizar treino</button>
                <div id="exibir_finalizar"></div>
            </div>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>

</html>
