<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stronger | Ajustar peso</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body onload="iniciarAjustes()">

    <header>
        <a class="logo" href="stronger.html">STRONGER</a>
        <nav>
            <a href="stronger.html">Home</a>
            <span id="menu_sistema">
                <a href="treino.html">Treino de Hoje</a>
                <a href="calculos.html">Cálculos</a>
                <a href="ajustes.html" class="ativo">Ajustar peso</a>
                <a href="termos.html" id="menu_termos" style="display: none;">Termos</a>
            </span>
        </nav>
        <div class="conta">
            <span id="menu_visitante">
                <a href="cadastro.html" class="botao">Cadastrar</a>
                <a href="login.html" class="botao">Login</a>
            </span>
            <span id="menu_usuario">
                <span id="exibir_nome"></span>
                <button onclick="sair()">Sair</button>
            </span>
        </div>
    </header>

    <main class="conteudo">
        <div class="caixa grande">
            <h2>Ajustar peso</h2>
            <h3>1RM dos levantamentos</h3>
            <input id="ipt_novo_agachamento" type="number" placeholder="Agachamento">
            <input id="ipt_novo_supino" type="number" placeholder="Supino">
            <input id="ipt_novo_overhead" type="number" placeholder="Overhead">
            <input id="ipt_novo_deadlift" type="number" placeholder="Deadlift">
            <button onclick="salvarAjustes()">Salvar</button>
            <button onclick="novoCiclo()">Finalizar ciclo (progredir carga)</button>
            <div id="exibir_ajustes"></div>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>

</html>
