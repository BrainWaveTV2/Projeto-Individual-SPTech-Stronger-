<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stronger | Cadastro</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <a class="logo" href="stronger.html">STRONGER</a>
        <nav>
            <a href="stronger.html">Home</a>
            <span id="menu_sistema">
                <a href="treino.html">Treino de Hoje</a>
                <a href="calculos.html">Cálculos</a>
                <a href="ajustes.html">Ajustar peso</a>
                <a href="termos.html" id="menu_termos" style="display: none;">Termos</a>
            </span>
        </nav>
        <div class="conta">
            <span id="menu_visitante">
                <a href="cadastro.html" class="botao ativo">Cadastrar</a>
                <a href="login.html" class="botao">Login</a>
            </span>
            <span id="menu_usuario">
                <span id="exibir_nome"></span>
                <button onclick="sair()">Sair</button>
            </span>
        </div>
    </header>

    <main class="conteudo">
        <!-- cadastro parte 1 -->
        <div id="tela_cadastro1" class="caixa">
            <h2>Cadastro (1/2)</h2>
            <input id="ipt_nome" placeholder="Nome de usuário">
            <input id="ipt_email" placeholder="Email">
            <input id="ipt_senha" type="password" placeholder="Senha">
            <input id="ipt_confirmar" type="password" placeholder="Confirmar senha">
            <button onclick="cadastroParte1()">Próximo</button>
            <div id="exibir_cad1" class="erro"></div>
            <p class="dica">Já tem conta? <a href="login.html">Faça login</a></p>
        </div>

        <!-- cadastro parte 2 -->
        <div id="tela_cadastro2" class="caixa" style="display: none;">
            <h2>Cadastro (2/2) - Perfil esportivo</h2>
            <label>Modelo:</label>
            <select id="ipt_modelo">
                <option>Powerlifter</option>
                <option disabled>Strongman (indisponível no momento)</option>
                <option disabled>Levantamento Olímpico (indisponível no momento)</option>
            </select>
            <label>Nível de experiência:</label>
            <select id="ipt_nivel">
                <option>Iniciante</option>
                <option>Intermediário</option>
                <option>Avançado</option>
            </select>
            <label>Unidade de peso:</label>
            <select id="ipt_unidade">
                <option>kg</option>
                <option>lb</option>
            </select>
            <input id="ipt_agachamento" type="number" placeholder="1RM Agachamento">
            <input id="ipt_supino" type="number" placeholder="1RM Supino">
            <input id="ipt_overhead" type="number" placeholder="1RM Overhead">
            <input id="ipt_deadlift" type="number" placeholder="1RM Deadlift">
            <input id="ipt_peso" type="number" placeholder="Seu peso corporal">
            <button onclick="cadastroParte2()">Finalizar cadastro</button>
            <button onclick="mostrar('tela_cadastro1')">Voltar</button>
            <div id="exibir_cad2" class="erro"></div>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>

</html>
